<title>NovaCore Client Portal</title>
<style>

.bp{position:absolute;right:0;top:56px;width:350px;max-width:92vw;max-height:430px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px #10304f38;z-index:40;animation:drop .25s both}.bp[hidden]{display:none}
.nt{padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}.nt:last-child{border-bottom:0}.nt:hover{background:#f6fbfd}.nt.un{background:#ecfaf7;border-left:3px solid var(--em)}.nt small{color:var(--mut)}
.toast{position:fixed;right:24px;bottom:24px;background:#fff;border:1px solid #99e0d6;border-left:4px solid var(--em);color:var(--tx);padding:14px 20px;border-radius:14px;box-shadow:0 18px 44px #10304f38;animation:up .4s cubic-bezier(.2,.8,.2,1) both;z-index:50;font-weight:600}
#login{max-width:420px;margin:10vh auto;padding:38px 34px}#login .logo{padding:0 0 6px;font-size:28px}

@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-50px)}}
@keyframes shine{from{background-position:0}to{background-position:200%}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes flow{from{background-position:0 0}to{background-position:200% 0}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
main>*{animation:fade .55s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}main>*:nth-child(n+6){animation-delay:.3s}
main.q>*{animation:none}
body.out{background:linear-gradient(125deg,#e3f7f4,#ecefff,#fff3de,#e3f7f4);background-size:300% 300%;animation:bg 18s ease infinite;overflow:hidden}
body.out::before,body.out::after,body.out #app::before{content:"";position:fixed;border-radius:50%;filter:blur(72px);opacity:.45;z-index:-1;animation:float 12s ease-in-out infinite}
body.out::before{width:360px;height:360px;background:#2dd4bf;left:7%;top:10%}
body.out::after{width:440px;height:440px;background:#818cf8;right:5%;bottom:5%;animation-delay:-5s}

#login{animation:pop .8s cubic-bezier(.2,.8,.2,1) both;backdrop-filter:blur(18px);background:#ffffffd9;box-shadow:0 36px 90px #10304f33;border-color:#fff}
#login .logo{background:linear-gradient(90deg,#10304f 30%,#14b8a6 50%,#10304f 70%);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
#login .logo i{color:inherit}
@media(max-width:820px){.app{flex-direction:column}aside{width:100%;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:8px 10px;border-radius:0}
.logo{padding:8px 12px}.logo::before{display:none}aside button.nv{width:auto;white-space:nowrap}aside button.nv.on::before{display:none}.me{display:none}.top{padding:14px 16px 8px;top:56px}main{padding:10px 16px 44px}.top h1{font-size:22px}.box{padding:18px}}
@media print{body{background:#fff}aside,.top,.no-print{display:none!important}.box,.kpis div,.tw{box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.tl{margin:6px 0}.tls{position:relative;display:flex;gap:16px;margin-bottom:18px;animation:fade .55s cubic-bezier(.2,.8,.2,1) both}
.tln{position:relative;width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#d4f5f0,#e1e7ff);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;box-shadow:var(--shadow)}
.tls:not(:last-child) .tln::after{content:"";position:absolute;top:56px;left:50%;width:2px;height:calc(100% + 22px);background:linear-gradient(#bfe6e0,transparent)}
.tlb{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}.tlb:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.tlb h4{margin:0 0 6px;color:var(--ink);font-size:16px}.tlb p{margin:0 0 10px;color:#4a5b73}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.ov{position:fixed;inset:0;background:#0a203866;backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s both}
.md{background:#fff;border-radius:26px;max-width:480px;width:100%;padding:36px 30px 24px;text-align:center;box-shadow:0 40px 100px #0a203855;animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.mi{width:80px;height:80px;margin:0 auto 16px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,#d4f5f0,#e1e7ff);animation:breathe 3s ease-in-out infinite}

</style></head><body>
<div id="app"></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwmdeetfjmgsZx06EDAWQVM5OOyPCDUmebgSpBYDQSUmcvw1Xx6vWMCKp4xsLa806EJ/exec'; // the /exec URL of the PortalAPI script
let T = sessionStorage.getItem('nc_t'), U = null, TAB = 'Dashboard', CO = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RC = {}, READS = ['listCompanies', 'listRequests', 'listCandidates', 'listInterviews', 'listInvoices', 'listDocuments', 'listMarket', 'listUsers', 'getCompany', 'slaStatus', 'adminOverview', 'dashboard', 'listMessages'];
async function api(action, data) { // reads are reused until the server's change counter moves (or 60s), writes clear the memory
  const isRead = READS.includes(action), key = isRead ? action + JSON.stringify(data || {}) : '', c = isRead ? RC[key] : null;
  if (c && REV !== null && c.rev === REV && Date.now() - c.t < 60000) return JSON.parse(c.v);
  const r = await apiRaw(action, data);
  if (isRead) RC[key] = { rev: REV, t: Date.now(), v: JSON.stringify(r) };
  else if (!['ping', 'notifications', 'markSeen', 'login', 'me'].includes(action)) for (const k in RC) delete RC[k];
  return r;
}
async function apiRaw(action, data) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, token: T, data }) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error); return j.data;
}
const val = id => $('#' + id).value;
const fields = ids => Object.fromEntries(ids.map(i => [i, val(i)]));
const isAdm = () => U.role === 'admin';
const canReq = () => ['company_admin', 'hr_manager'].includes(U.role);

async function boot() {
  const act = new URLSearchParams(location.search).get('activate');
  if (act) return activateView(act);
  const rst = new URLSearchParams(location.search).get('reset'); if (rst) return resetView(rst);
  if (T) { try { U = await api('me'); return shell(); } catch (e) { T = null; sessionStorage.removeItem('nc_t'); } }
  loginView();
}
function loginView() {
  clearInterval(POLL);
  document.body.classList.add("out"); startTag();
  $('#app').innerHTML = `<div id="login" class="box"><div class="logo">Nova<i>Core</i></div><p class="sub" id="tg">Welcome back 👋 Sign in to continue.</p>
  <label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
  <div class="err" id="er"></div><button class="p" id="go">Log in</button><p style="margin:16px 0 0"><a href="#" id="fg" style="color:var(--em2);font-weight:600">Forgot your password?</a></p></div>`;
  $('#go').onclick = async () => { try { const r = await api('login', { email: val('em'), password: val('pw') });
    T = r.token; U = r.user; sessionStorage.setItem('nc_t', T); shell(); } catch (e) { $('#er').textContent = e.message; } };
  $('#fg').onclick = ev => { ev.preventDefault(); forgotView(); };
}
function forgotView() {
  document.body.classList.add('out');
  $('#app').innerHTML = `<div id="login" class="box"><div class="logo">Nova<i>Core</i></div><p class="sub">Enter your email and we will send you a reset link.</p>
  <label>Email</label><input id="fe" type="email"><div class="err" id="er"></div><button class="p" id="go">Send reset link</button>
  <p style="margin:16px 0 0"><a href="#" id="bk" style="color:var(--em2);font-weight:600">Back to login</a></p></div>`;
  $('#go').onclick = async () => { try { await api('forgotPassword', { email: val('fe') }); $('#er').style.color = 'var(--em2)'; $('#er').textContent = 'If this email has an account, a reset link is on its way. It is valid for 1 hour.'; } catch (e) { $('#er').textContent = e.message; } };
  $('#bk').onclick = ev => { ev.preventDefault(); loginView(); };
}
function resetView(tok) {
  document.body.classList.add('out');
  $('#app').innerHTML = `<div id="login" class="box"><div class="logo">Nova<i>Core</i></div><p class="sub">Choose a new password.</p>
  <label>New password (8+ characters)</label><input id="pw" type="password"><label>Repeat it</label><input id="pw2" type="password"><div class="err" id="er"></div><button class="p" id="go">Save new password</button></div>`;
  $('#go').onclick = async () => { try { if (val('pw') !== val('pw2')) throw new Error('The passwords do not match.'); await api('resetPassword', { token: tok, password: val('pw') });
    history.replaceState({}, '', location.pathname); loginView(); toast('Password updated. You can log in now 🔐'); } catch (e) { $('#er').textContent = e.message; } };
}
function activateView(tok) {
  document.body.classList.add("out");
  $('#app').innerHTML = `<div id="login" class="box"><div class="logo">Nova<i>Core</i></div><p class="sub">Set your password to activate your account.</p>
  <label>New password (8+ characters)</label><input id="pw" type="password"><div class="err" id="er"></div>
  <button class="p" id="go">Activate account</button></div>`;
  $('#go').onclick = async () => { try { await api('activate', { invite: tok, password: val('pw') });
    history.replaceState({}, '', location.pathname); loginView(); } catch (e) { $('#er').textContent = e.message; } };
}
function shell() {
  document.body.classList.remove("out"); clearInterval(TIM);
  const R = U.role, A = ['Dashboard', 'Companies', 'Contracts', 'Requests', 'Candidates', 'Interviews', 'Documents', 'Messages', 'Reports'], C = ['Dashboard', 'Company', 'Contract', 'Requests', 'Candidates', 'Interviews', 'Documents', 'Messages', 'Reports'];
